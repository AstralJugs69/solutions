<html lang="en" class="scroll-smooth">
  <head>

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Portfolio | Innovative Software Solutions" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Portfolio | Innovative Software Solutions</title>
    
    <!-- Preload critical CSS -->
    <style>
      @font-face {
        font-family: 'Inter var';
        font-weight: 100 900;
        font-display: swap;
        font-style: normal;
        src: url('https://rsms.me/inter/font-files/Inter.var.woff2') format('woff2');
      }
    </style>
    <script>
      (function() {
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mediaQuery.matches) {
          document.documentElement.classList.add('motion-reduce');
        }
        // Optional: Add listener to update if preference changes
        // mediaQuery.addEventListener('change', () => {

        //     document.documentElement.classList.add('motion-reduce');
        //   } else {
        //     document.documentElement.classList.remove('motion-reduce');
        //   }
        // });
      })();
    </script>
  </head>
  <body class="min-h-screen bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
